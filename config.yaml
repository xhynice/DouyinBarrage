# ==================== 房间配置 ====================
# 房间列表已移至 rooms.txt 文件
# 格式：每行一个房间，id,name（逗号分隔）
# # 开头表示不启用

# ==================== 日志配置 ====================
log_level: INFO                  # 日志级别: DEBUG / INFO / WARNING / ERROR / NONE（NONE=关闭日志，数据文件照常写入）

# ==================== 等待开播配置 ====================
live_stop: true                  # 直播结束后是否停止退出: true=结束退出 / false=等待重开播
live_check_interval: 160         # 未开播时 HTTP 轮询间隔（秒）

# ==================== 消息类型开关 ====================
output:
  chat: true                     # 弹幕
  lucky_bag: true                # 福袋口令
  gift: true                     # 礼物
  like: true                     # 点赞
  member: false                  # 进场
  social: true                   # 关注/分享
  rank: false                    # 排行榜
  stats: true                    # 统计
  fansclub: false                # 粉丝团
  emoji: false                   # 表情
  room: false                    # 直播间公告
  roomstats: false               # 直播统计
  control: true                  # 直播状态

# ==================== 输出格式配置 ====================
format:
  gift_combo_final: true         # 礼物连击过滤: true=只记录连击最终值(x520) / false=记录每次递增(x1,x2,...,x520)
  csv: true                      # CSV 输出
  sqlite: false                   # SQLite 输出
  file_dir: data                 # 数据输出目录

