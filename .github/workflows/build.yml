name: Barrage

on:
  workflow_dispatch:
    inputs:
      live_id:
        description: '直播间ID (留空则采集rooms.txt全部房间)'
        required: false
        default: ''
      live_stop:
        description: '直播结束后行为'
        required: false
        default: 'stop'
        type: choice
        options:
          - stop
          - wait

concurrency:
  group: barrage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create cookie file from secret
      run: |
        if [ -n "${{ secrets.COOKIE_TXT }}" ]; then
          echo "${{ secrets.COOKIE_TXT }}" | base64 -d > cookie.txt
          echo "已创建 cookie.txt"
        else
          echo "未配置 COOKIE_TXT secret，将以游客身份采集"
        fi

    - name: Run barrage collector
      run: |
        LIVE_ID="${{ github.event.inputs.live_id }}"
        LIVE_END="${{ github.event.inputs.live_stop || 'stop' }}"
        # 安全校验：live_id 只允许数字
        if [ -n "$LIVE_ID" ]; then
          if ! [[ "$LIVE_ID" =~ ^[0-9]+$ ]]; then
            echo "错误：直播间ID只能包含数字，收到: $LIVE_ID"
            exit 1
          fi
          echo "采集指定直播间: $LIVE_ID"
          ARGS="$LIVE_ID"
        else
          echo "采集 rooms.txt 全部房间"
          ARGS="--all"
        fi
        if [ "$LIVE_END" = "wait" ]; then
          python main.py $ARGS --live-wait
        else
          python main.py $ARGS --live-stop
        fi
      continue-on-error: true

    - name: Upload data artifacts
      uses: actions/upload-artifact@v4
      with:
        name: barrage-data-${{ github.run_number }}
        path: |
          data/
          logs/
        retention-days: 3

    - name: Commit data to data branch
      continue-on-error: true
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # 切换到 barrage-data 分支（data/ 已在工作区，无需额外 checkout）
        git fetch origin barrage-data || true
        if git rev-parse --verify origin/barrage-data >/dev/null 2>&1; then
          git checkout barrage-data
        else
          git checkout --orphan barrage-data
          git rm -rf . --quiet 2>/dev/null || true
        fi

        git add -f data/ logs/ 2>/dev/null || true
        if git diff --staged --quiet; then
          echo "无数据变化，跳过提交"
        else
          git commit -m "Update barrage data: $(date '+%Y-%m-%d %H:%M') [skip ci]"
          git push origin barrage-data
        fi
